<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Admin · Roomescape</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="/styles.css" rel="stylesheet" />
</head>
<body>

<nav class="navbar">
  <a class="nav-logo" href="/">// ROOMESCAPE</a>
  <div class="nav-actions">
    <button class="nav-btn" id="adminLogoutBtn" type="button">관리자 로그아웃</button>
  </div>
</nav>

<main class="page" style="padding-top:0;">
  <header class="hero">
    <p class="eyebrow">// Roomescape · Admin Console</p>
    <h1>관리자 콘솔</h1>
    <p>예약·시간·테마를 관리한다. 전화 예약·노쇼 처리·상태 변경 같은 모든 백오피스 액션은 여기서.</p>
  </header>

  <section class="panel">
    <h2>관리 영역</h2>
    <p class="panel-sub">아래 카드를 눌러 들어가.</p>
    <div class="hub-grid">
      <a class="hub-card" href="/admin/reservation.html">
        <p class="hub-tag">// reservation</p>
        <h3>예약 관리</h3>
        <p>조회·추가·수정·취소 · 상태(RESERVED / CANCELED / COMPLETED) 확인</p>
      </a>
      <a class="hub-card" href="/admin/time.html">
        <p class="hub-tag">// time</p>
        <h3>시간 관리</h3>
        <p>예약 가능한 시간 슬롯 추가 · 삭제</p>
      </a>
      <a class="hub-card" href="/admin/theme.html">
        <p class="hub-tag">// theme</p>
        <h3>테마 관리</h3>
        <p>테마 카탈로그 추가 · 수정 · 삭제</p>
      </a>
    </div>
  </section>
</main>

<script src="/auth.js"></script>
<script>
  // 관리자 세션 검증: /admin/reservations 에 HEAD 요청 → 403이면 미인증
  (async function checkAdminAuth() {
    try {
      const res = await fetch('/admin/reservations', { method: 'GET', headers: { 'Content-Type': 'application/json' } });
      if (res.status === 403 || res.status === 401) {
        alert('관리자 인증이 필요합니다. 홈에서 관리자 버튼을 눌러 비밀번호를 입력해 주세요.');
        location.href = '/';
      }
    } catch (_) {
      // 네트워크 오류는 무시 (서버 기동 중일 수 있음)
    }
  })();

  document.getElementById('adminLogoutBtn').addEventListener('click', async () => {
    try { await fetch('/admin/logout', { method: 'POST' }); } catch (_) {}
    localStorage.removeItem('adminToken');
    location.href = '/';
  });
</script>
</body>
</html>
